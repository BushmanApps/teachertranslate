    <script>
      // EscapeBase44 mobile shell v5: links back into the app, the splash,

            return !(res.rejected || []).some(function (r) { return r.product_id === t.product_id; });

          });

          appId: APP_ID,
          isMobileApp: native,
          iap: {
            available: function () {
              var p = plugin("NativePurchases");
              if (!native() || !p) return Promise.resolve(false);
              return p.isBillingSupported().then(function (r) { return !!r.isBillingSupported; }, function () { return false; });
            },
            getProducts: function (ids, opts) {
              var p = plugin("NativePurchases");

            },
            // purchase("premium_monthly", { type: "subs", plan: "monthly" })
            // type: "inapp" (a one-time unlock) | "subs" | "consumable" (a
            // credit pack, declared in IAP_CREDIT_PACKS). plan = the Google
            // Play base-plan id, required for Android subscriptions. Resolves
            // the person's entitlements — for a credit pack, what was added

            entitlements: function () { return api(API_IAP, "/entitlements").then(function (r) { return r.entitlements; }); },

            // website beside the in-app purchase (Apple 3.1.1(a)); everywhere

                return { country: country, webCheckoutLink: platform() === "ios" && country === "USA" };
              }, function () { return { country: "", webCheckoutLink: false }; });
            },
          },
          push: {
            // Registers this device for the app's push notifications when the
            // owner has push set up for this platform; resolves false and does
            // nothing (no prompt) otherwise. Runs on every native launch with a
            // signed-in user (device tokens rotate); call it after a login that
            // did not reload the page.

              var P = plugin("PushNotifications");
              if (!native() || !P || !token()) return Promise.resolve(false);

            },
          },
          ads: {
            // "admob" (an AdMob app on this platform: every call below works),
            // "webview" (only the ads inside the app's own pages), "none".
            mode: adsMode,
            // Call once, before the first ad: Google's consent question where
